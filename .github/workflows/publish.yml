name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Incidente 12/11/2026: o trusted publishing do npm exige este environment, que so libera a main.
    # Sem ele, um workflow com este mesmo nome num branch publicaria no npm.
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm install -g npm@latest

      - run: npm publish --access public --provenance
